<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome to Mimic</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.mm{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,sans-serif;--mono:"SF Mono",SFMono-Regular,ui-monospace,Menlo,monospace;font-family:var(--font);font-size:13px;line-height:16px;color:var(--l1);-webkit-font-smoothing:antialiased;box-sizing:border-box}
.mm *{box-sizing:border-box}
.dark{--win:#1e1e20;--side:#26262a;--field:rgba(255,255,255,.07);--field-b:rgba(255,255,255,.1);--sep:rgba(255,255,255,.08);--l1:rgba(255,255,255,.92);--l2:rgba(235,235,245,.62);--l3:rgba(235,235,245,.38);--accent:#0a84ff;--sel:#0a6ce0;--hover:rgba(255,255,255,.05);color-scheme:dark}
.light{--win:#ffffff;--side:#f3f3f5;--field:rgba(0,0,0,.045);--field-b:rgba(0,0,0,.12);--sep:rgba(0,0,0,.09);--l1:rgba(0,0,0,.88);--l2:rgba(60,60,67,.72);--l3:rgba(60,60,67,.48);--accent:#007aff;--sel:#0a74f0;--hover:rgba(0,0,0,.04);color-scheme:light}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.grow{flex:1 1 auto;min-width:0}
.l2{color:var(--l2)}.l3{color:var(--l3)}
.ic{width:16px;height:16px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tl{width:12px;height:12px;border-radius:50%;display:block}
.act{all:unset;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;width:100%;box-sizing:border-box}
.act .ico{width:28px;height:28px;border-radius:7px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.act .k{margin-left:auto;font-size:12px;color:var(--l3)}
.rec{display:flex;align-items:center;gap:12px;height:52px;padding:0 12px;border-radius:10px}
.rec.sel{background:var(--sel);color:#fff}
.rec.sel .l2,.rec.sel .l3{color:rgba(255,255,255,.8)}
.mono-ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none}
</style>
</helmet>
<div class="mm {{theme}}" style="width: 880px; height: 560px; background: var(--win); display: flex; border-radius: 18px; overflow: hidden; box-shadow: inset 0 0 0 .5px var(--sep);">
  <div class="col" style="width: 400px; flex: none; padding: 16px 32px 28px; position: relative;">
    <div class="row" style="gap: 8px; height: 20px;"><span class="tl" style="background: #ff5f57;"></span><span class="tl" style="background: #febc2e;"></span><span class="tl" style="background: #28c840;"></span></div>
    <div class="col" style="align-items: center; margin-top: 36px; gap: 6px;">
      <div style="width: 112px; height: 112px; border-radius: 26px; background: linear-gradient(160deg, #3a3f4a, #16181d); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 .5px rgba(255,255,255,.2);">
        <svg viewBox="0 0 32 32" style="width: 72px; height: 72px;"><path d="M6 9a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4h-5l-4 3v-3a3 3 0 0 1-3-3z" style="fill: #5aa9ff;"/><path d="M26 14a4 4 0 0 0-4-4h-1v5a4 4 0 0 1-4 4h-4v1a4 4 0 0 0 4 4h4l4 3v-3a3 3 0 0 0 1-2.2z" style="fill: #4fd07b; opacity: .95;"/></svg>
      </div>
      <span style="font-size: 28px; line-height: 34px; font-weight: 700; margin-top: 12px;">Mimic</span>
      <span class="l2">Version 1.9</span>
    </div>
    <div class="col" style="margin-top: 28px; gap: 2px;">
      <button class="act"><span class="ico"><svg class="ic" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></span><span style="font-weight: 500;">New project…</span><span class="k">⌘N</span></button>
      <button class="act"><span class="ico"><svg class="ic" viewBox="0 0 16 16"><path d="M8 2v7M5 6.5L8 9.5l3-3"/><path d="M2.5 9.5v2.5a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5V9.5"/></svg></span><span style="font-weight: 500;">Import HAR or OpenAPI…</span></button>
      <button class="act"><span class="ico"><svg class="ic" viewBox="0 0 16 16"><path d="M2 4.5a1.5 1.5 0 0 1 1.5-1.5h2.8l1.4 1.5h4.8A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/></svg></span><span style="font-weight: 500;">Open project export…</span><span class="k">⌘O</span></button>
      <button class="act"><span class="ico"><svg class="ic" viewBox="0 0 16 16"><path d="M8 2l1.6 3.9 4.2.3-3.2 2.7 1 4.1L8 10.8l-3.6 2.2 1-4.1-3.2-2.7 4.2-.3z"/></svg></span><span style="font-weight: 500;">Try the sample project</span></button>
    </div>
  </div>
  <div class="col grow" style="background: var(--side); border-left: .5px solid var(--sep); padding: 44px 12px 12px;">
    <span style="font-size: 11px; font-weight: 600; color: var(--l3); padding: 0 12px 8px;">Recent projects</span>
    <div class="col" style="gap: 2px;">
      <div class="rec sel"><span class="mono-ic" style="background: #0a84ff;">AS</span><div class="col grow" style="gap: 2px;"><span style="font-weight: 600;">Acme Storefront</span><span class="l2" style="font-size: 11px;">Port 18086 · 12 endpoints · 3 journeys</span></div><span class="l3" style="font-size: 11px;">Today</span></div>
      <div class="rec"><span class="mono-ic" style="background: #34a853;">WA</span><div class="col grow" style="gap: 2px;"><span style="font-weight: 600;">Weather API</span><span class="l2" style="font-size: 11px;">Port 8080 · 4 endpoints</span></div><span class="l3" style="font-size: 11px;">Yesterday</span></div>
      <div class="rec"><span class="mono-ic" style="background: #af52de;">BK</span><div class="col grow" style="gap: 2px;"><span style="font-weight: 600;">Banking iOS</span><span class="l2" style="font-size: 11px;">Ports 9000, 9001 · 38 endpoints · 7 journeys</span></div><span class="l3" style="font-size: 11px;">Sep 21</span></div>
      <div class="rec"><span class="mono-ic" style="background: #ff9f0a;">GQ</span><div class="col grow" style="gap: 2px;"><span style="font-weight: 600;">GraphQL Gateway</span><span class="l2" style="font-size: 11px;">Port 4000 · 9 operations</span></div><span class="l3" style="font-size: 11px;">Sep 14</span></div>
    </div>
    <span class="grow"></span>
    <label class="row l2" style="gap: 8px; font-size: 12px; padding: 0 12px;"><input type="checkbox" id="showWelcome" checked style="margin: 0;">Show this window when Mimic opens</label>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
