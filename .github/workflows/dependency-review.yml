name: Dependency review

# Blocks a pull request that adds a dependency with a known vulnerability of moderate severity or
# worse, before it reaches main. Dependabot alerts cover what is already merged; this covers what is
# about to be. It reads the dependency graph diff GitHub builds from `Package.resolved`,
# `Tuist/Package.resolved` and the workflow files, so it needs no build and no runner time to speak
# of.
#
# Licences are checked too: a new dependency must carry a licence compatible with shipping Mimic
# under MIT. The allow list is the permissive set the current dependencies already use.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # the summary comment, posted only when the review fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense
          comment-summary-in-pr: on-failure
