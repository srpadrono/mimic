name: CodeQL

# Static analysis for the three languages this repository ships: Swift (the app, CLI and server),
# Python (the `Scripts/` checks CI trusts), and the GitHub Actions workflows themselves.
#
# Python and Actions need no build, so they analyse on Linux. Swift is traced from a real compile,
# which needs the same macOS 26 image, pinned Tuist and generated workspace as CI; the shared
# `macos-setup` action provides all three. Only the Debug app scheme is built: it compiles every
# first-party module the release does, plus the `mimic` CLI.
#
# Runs on pull requests and main like CI, and weekly so new queries reach an unchanged tree.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}

    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
            timeout: 15
          - language: python
            build-mode: none
            runner: ubuntu-latest
            timeout: 15
          - language: swift
            build-mode: manual
            runner: macos-26
            timeout: 90

    env:
      DERIVED_DATA: .artifacts/DerivedData

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before CodeQL starts tracing, so Tuist's manifest compiles are not analysed as our code.
      - if: matrix.language == 'swift'
        uses: ./.github/actions/macos-setup

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL needs every Swift file compiled from scratch, so no cached DerivedData and no
      # compilation cache.
      - name: Build (Swift)
        if: matrix.language == 'swift'
        run: |
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
