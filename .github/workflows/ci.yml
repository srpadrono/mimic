name: CI

# Two runners, split by what actually needs a Mac.
#
# The domain rules, the mock engine, persistence, the control plane, spec import and the CLI are
# plain Swift — Vapor's native home is Linux — so `Package.swift` builds them on a Linux runner and
# most of the suite reports back in a couple of minutes. The app bundle, SwiftUI, the app-level
# suites, the Release gate and XCUITest need Xcode, so they run on macOS.
#
# Both are free: GitHub does not meter standard hosted runners on public repositories, macOS
# included. That was not always true here — while this repo was private, every run died in about two
# seconds with zero steps executed, which is why the automatic triggers used to be commented out and
# the macOS job was `if: false`. Making the repo public resolved it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Nothing here publishes anything, and a public repository runs this workflow
# against code from strangers, so the token it hands them should be able to do as little as possible.
permissions:
  contents: read

# Every third-party action is pinned to a commit, not a tag. A tag is a moving pointer its owner can
# repoint at any time, and these run with repository context on pull requests — including forks. The
# trailing comment is the human-readable version; the SHA is what actually runs.

concurrency:
  # A newer push makes an in-flight run irrelevant *on a pull request*, where only the tip matters.
  # On `main` it does not: every commit there is an artefact someone may bisect to, and `github.ref`
  # is `refs/heads/main` for pushes and manual runs alike, so they all shared one group. That has
  # already happened — a `workflow_dispatch` on main was cancelled by the next push, leaving the
  # commit before it with no completed run and no red X to say so. Both runners are free here.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First, and before anything is installed, because it is the cheapest thing in the workflow: a
      # few greps over the Swift sources, no toolchain, under a second. It decides the AGENTS.md rules
      # that are literal enough for a grep to settle — casing, `@AppStorage`, `asyncAfter`, the
      # deprecated `Alert()`, and the two XCUITest waiting rules. Each had been broken at least once
      # and caught only by somebody happening to read the diff, which is not a mechanism.
      #
      # It runs here rather than on macOS because it needs nothing a Mac has: it reads
      # `MimicUITests/` as text, so the one job that never builds the UI suite is still the right
      # place to check how it is written.
      - name: House rules
        run: ./Scripts/check_house_rules.sh

      # GRDB compiles against SQLite's C headers, which the Swift image does not ship. Without this
      # the build fails with "'sqlite3.h' file not found" — verified by running this container locally.
      - name: Install SQLite headers
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev

      # Recorded, and then used in the cache key below. `container: swift:6.2` is a tag its owner
      # repoints at each patch release, so `runner.os` alone keys a `.build` full of .swiftmodules at
      # whatever compiler produced them — and restoring those into a newer one fails with "module
      # compiled with Swift X cannot be imported by Swift Y", which reads as a source problem and
      # reproduces nowhere locally.
      - name: Swift version
        id: swift
        run: |
          swift --version
          echo "key=$(swift --version | head -1 | tr -c 'a-zA-Z0-9' '-' | tr -s '-')" >> "$GITHUB_OUTPUT"

      # The two manifests declare the same dependency ranges from the same directories, and then
      # resolve them into two separate lockfiles. That is a drift generator: 21 packages had already
      # diverged, including Vapor, NIO and GRDB — so this job's socket-binding suites were passing
      # against versions the shipped .pkg does not contain. Nothing detected it, because the claim
      # that the manifests "cannot drift" was written in prose rather than checked.
      #
      # This compares the *union*, not the intersection. The first version of it iterated
      # `root.keys() & tuist.keys()`, which meant a package present in one lockfile and absent from
      # the other was simply not looked at — precisely the shape a dropped or newly one-sided
      # dependency takes, and the one case where "the versions agree" is the wrong question. The two
      # legitimately one-sided packages are named below instead: Tuist builds DesignSystem, which
      # links CodeEditorView, which pulls Rearrange, and Package.swift declares no SwiftUI target for
      # either to attach to. Naming them keeps today green while a *new* one-sided package fails, and
      # the allowlist is itself checked for staleness, because a list that has stopped describing the
      # tree has stopped checking it.
      - name: Lockfiles agree
        run: |
          python3 - <<'PY'
          import json, sys
          TUIST_ONLY, ROOT_ONLY = {'codeeditorview', 'rearrange'}, set()
          def pins(path):
              return {p['identity']: p['state'].get('version') for p in json.load(open(path))['pins']}
          root, tuist = pins('Package.resolved'), pins('Tuist/Package.resolved')
          problems = [f"{k}: Package.resolved={root[k]} Tuist/Package.resolved={tuist[k]}"
                      for k in sorted(root.keys() & tuist.keys()) if root[k] != tuist[k]]
          problems += [f"{k}: in Package.resolved ({root[k]}) and missing from Tuist/Package.resolved"
                       for k in sorted(root.keys() - tuist.keys() - ROOT_ONLY)]
          problems += [f"{k}: in Tuist/Package.resolved ({tuist[k]}) and missing from Package.resolved"
                       for k in sorted(tuist.keys() - root.keys() - ROOT_ONLY - TUIST_ONLY)]
          problems += [f"{k}: allowlisted as one-sided but is no longer — drop it from the allowlist"
                       for k in sorted((TUIST_ONLY - (tuist.keys() - root.keys()))
                                       | (ROOT_ONLY - (root.keys() - tuist.keys())))]
          for line in problems:
              print(line)
          if problems:
              sys.exit(f"{len(problems)} lockfile problem(s) — re-resolve both lockfiles to one set, "
                       "or update the one-sided allowlist in this check")
          print(f"{len(root.keys() & tuist.keys())} shared packages agree; "
                f"{len(TUIST_ONLY | ROOT_ONLY)} allowlisted as one-sided")
          PY

      # The other half of the same drift, and the half that is still open: the lockfiles now agree on
      # *versions*, and nothing yet makes the two manifests agree on how the compiler is configured.
      # `Project.swift` sets four Swift settings in its shared base; `Package.swift` sets none. So
      # this job is the looser gate — it can go green on an implicit transitive import that Xcode
      # rejects, because member-import visibility is enforced there and not here.
      #
      # It warns rather than fails, deliberately. Enabling the missing setting in `Package.swift`
      # would light up every portable module at once, and this workflow is the only place a Linux
      # compiler runs on this code — so the errors could only be fixed by pushing at a red pipeline
      # and reading what came back, which is not a way to do that work. Warning makes the gap visible
      # on every run and in the job summary without blocking anyone.
      #
      # The follow-up is to close it: add `swiftSettings: [.enableUpcomingFeature(...)]` to the
      # targets in `Package.swift`, on a machine with a Swift 6.2 toolchain, fixing the imports it
      # surfaces in the same change; then this step goes quiet on its own. `SWIFT_UPCOMING_FEATURE_*`
      # is matched generically, so a feature added to `Project.swift` later is picked up here with no
      # edit. A setting with no mapping recorded is reported too, so a new one cannot slip past by
      # being unrecognised.
      - name: Compiler settings
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          def warn(path, message):
              print(('::warning file=%s::%s' if os.environ.get('GITHUB_ACTIONS') else 'WARNING (%s): %s')
                    % (path, message))
          project = pathlib.Path('Project.swift').read_text()
          # Whole-line comments are dropped so a feature merely *named* in prose cannot satisfy the
          # check. Trailing comments are left alone on purpose: `//` also appears inside every
          # `.package(url:)`, and cutting there would mangle the manifest this is reading.
          package = "\n".join(l for l in pathlib.Path('Package.swift').read_text().splitlines()
                              if not l.lstrip().startswith('//'))
          block = re.search(r'let sharedSettings.*?configurations:', project, re.S)
          if block is None:
              warn('Project.swift', 'Could not find `sharedSettings`, so this check compared nothing. '
                                    'Point it at wherever the shared base settings moved to.')
              raise SystemExit(0)
          xcode = dict(re.findall(r'"(SWIFT_[A-Z_0-9]+)"\s*:\s*"([^"]*)"', block.group(0)))
          # Spelled differently in the two manifests but meaning the same thing today. Printed every
          # run, because that is a fact about the current tree rather than a property of either file.
          EQUIVALENT_TODAY = {
              'SWIFT_VERSION':
                  'swift-tools-version 6.0 already puts SwiftPM in language mode 6',
              'SWIFT_DEFAULT_ACTOR_ISOLATION':
                  'every module Package.swift builds overrides this to "none" in Project.swift, and '
                  'nonisolated is what SwiftPM defaults to — so the two agree by coincidence, not by '
                  'construction',
          }
          # Deliberately NOT in the dict above. It is an Xcode umbrella that turns on a set of upcoming
          # concurrency features, and Package.swift enables none of them — so calling it "equivalent
          # today" would file a real divergence under the heading of things that are only spelled
          # differently, which is the failure this whole check exists to stop. It has no one-to-one
          # SwiftPM spelling, so it is reported as unmapped rather than as a missing feature flag.
          UMBRELLA_WITHOUT_SWIFTPM_SPELLING = {
              'SWIFT_APPROACHABLE_CONCURRENCY':
                  'an Xcode umbrella over several upcoming concurrency features; Package.swift enables '
                  'none of them, so the Linux gate is genuinely looser here',
          }
          looser, unmapped, notes = [], [], []
          for name, value in sorted(xcode.items()):
              if name.startswith('SWIFT_UPCOMING_FEATURE_'):
                  # Xcode names an upcoming feature in UPPER_SNAKE, SwiftPM in UpperCamel. Deriving
                  # it means a feature added to Project.swift is picked up with no edit here.
                  feature = ''.join(w.capitalize()
                                    for w in name[len('SWIFT_UPCOMING_FEATURE_'):].split('_'))
                  token = 'enableUpcomingFeature("%s")' % feature
                  if token not in package:
                      looser.append('  %s = %s — Package.swift declares no .%s' % (name, value, token))
              elif name in UMBRELLA_WITHOUT_SWIFTPM_SPELLING:
                  unmapped.append('  %s = %s — %s' % (name, value, UMBRELLA_WITHOUT_SWIFTPM_SPELLING[name]))
              elif name in EQUIVALENT_TODAY:
                  notes.append('  %s = %s — %s' % (name, value, EQUIVALENT_TODAY[name]))
              else:
                  unmapped.append('  %s = %s — this check has no SwiftPM mapping for it; add one'
                                  % (name, value))
          for line in looser + unmapped + notes:
              print(line)
          if looser or unmapped:
              warn('Package.swift',
                   '%d Swift setting(s) Project.swift applies that Package.swift does not, so this '
                   'gate is looser than the compiler that ships the app. Reported, not enforced: '
                   'turning them on here lights up every portable module at once, and closing those '
                   'errors wants a toolchain to hand rather than a red pipeline to iterate against.'
                   % (len(looser) + len(unmapped)))
          else:
              print('Every Swift setting Project.swift applies is declared in Package.swift too.')
          PY

      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-${{ steps.swift.outputs.key }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-${{ steps.swift.outputs.key }}-spm-

      - name: Build
        run: swift build --build-tests

      # Domain, Persistence, MockServerEngine, ControlPlane, SpecImport and MimicCLICore — including
      # the tests that bind real sockets and serve real HTTP.
      - name: Test
        run: swift test --skip-build

  macos:
    name: Build and test (macOS)
    runs-on: macos-26
    # The Release build alone is several minutes on a 3-core runner, and the UI suite launches the
    # real app once per test.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # macOS 26 and Swift 6.2 are the floor: `SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor` and the
      # macOS 26 SDK are both required to compile at all, so the image label is load-bearing rather
      # than a preference. Printed so a green run says which Xcode produced it.
      - name: Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      # The one thing that makes macOS XCUITest possible on a hosted runner.
      #
      # Since Monterey, macOS asks a human to approve UI automation before a test runner may drive
      # another app. Nobody is at the keyboard here, so the request is never answered and the runner
      # fails to initialise at all: `Timed out while enabling automation mode`, zero tests executed —
      # which reads like a broken suite rather than a missing permission. This is the supported way
      # to pre-authorise it, and it is why the UI tests can run here at all.
      - name: Allow UI automation without an interactive prompt
        run: sudo automationmodetool enable-automationmode-without-authentication

      # Tuist generates the workspace; nothing in the repo is a checked-in Xcode project.
      #
      # Pinned in `mise.toml`, not `brew install tuist`. Homebrew hands out whatever is current — it
      # produced 4.202.6 against the 4.152.0 this project is developed on, and `tuist install` failed
      # outright. A generator that silently tracks upstream turns "someone else released" into "our CI
      # is red".
      #
      # The version lives in `mise.toml` rather than here because this action takes no `tools` input —
      # passing one is accepted, warned about, and ignored, which installs nothing and leaves `tuist`
      # off PATH for a step that then fails with exit 127.
      - name: Install Tuist
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # Tuist resolves the SPM dependencies into the workspace, so this cache is what keeps a run
      # from rebuilding Vapor and GRDB from source every time.
      - name: Cache Tuist dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/tuist
            Tuist/.build
          key: ${{ runner.os }}-tuist-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved', 'Project.swift') }}
          restore-keys: ${{ runner.os }}-tuist-

      - name: Resolve and generate
        run: |
          tuist version
          tuist install
          tuist generate --no-open

      # Tuist reports failures as an unhelpful "Error" and writes the reason to a session log the
      # runner throws away. Without this a failure here says nothing at all.
      - name: Tuist logs on failure
        if: failure()
        # Never the reason a run is red: this only ever explains one.
        continue-on-error: true
        run: |
          find ~/.local/state/tuist/sessions -name logs.txt 2>/dev/null | while read -r f; do
            echo "-- $f"
            tail -100 "$f"
          done

      # Ad-hoc signing throughout. The project carries a DEVELOPMENT_TEAM for local builds, but a
      # hosted runner has none of that team's certificates — and none are needed, because a macOS app
      # only has to be signed *somehow* to launch, which is what `-` means.
      - name: Build (Debug)
        run: |
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- build

      # Everything that needs Xcode but not a window: the app-level suites and the DesignSystem
      # rendering tests. The rest of the suite already ran on Linux.
      - name: Test (unit suites)
        run: |
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic-Workspace \
            test -destination 'platform=macOS' -skip-testing:MimicUITests \
            CODE_SIGN_IDENTITY=-

      # The reason this job exists. XCUITest is the only thing that exercises the real window — the
      # accessibility tree, the panel layout, and every flow a user actually takes.
      #
      # `-retry-tests-on-failure` is not papering over flakiness in the app: this suite launches the
      # real app once per test, and a hosted runner under memory pressure will SIGKILL a random one.
      # A retry distinguishes that from a genuine assertion failure, which fails again on the retry.
      - name: Test (UI)
        run: |
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic \
            test -destination 'platform=macOS' -only-testing:MimicUITests \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGN_IDENTITY=-

      # Deliberately NOT run here: ./Scripts/run_cli_e2e.sh
      #
      # AGENTS.md and CONTRIBUTING.md both list it as a gate, and it is the only thing that covers
      # process launch, discovery-file resolution and real HTTP end to end — so its absence is a real
      # hole, recorded here so it stays a decision rather than an oversight. Three things block it,
      # and none of them can be fixed inside this file:
      #
      #   - It cannot find what this job built. `MIMIC_BIN` comes from
      #     `find "$ROOT_DIR" … -path '*Build/Products*'`, which only matches when DerivedData sits
      #     inside the checkout. No step above passes `-derivedDataPath`, so the products are under
      #     `~/Library/Developer/Xcode/DerivedData` — the artifact step at the bottom of this job
      #     reads them from exactly there — the `find` returns nothing, and the script falls through
      #     to `command -v mimic` and exits 1 before running a single assertion.
      #   - The app is resolved separately from the CLI. `AppLauncher.resolveExecutable` tries
      #     `MIMIC_APP_PATH`, `/Applications/Mimic.app` and `~/Applications/Mimic.app`, none of which
      #     a hosted runner has, so a working step has to plumb in *two* paths, not one.
      #   - Its cleanup is not scoped to the instance it started. `mimic app stop` ignores
      #     `MIMIC_CONTROL_URL` and `MIMIC_CONTROL_PORT` entirely: `AppCommand.Stop` calls
      #     `ControlEndpointFileReader.discover()`, which reads the single `control.json` under
      #     Application Support and SIGTERMs whatever pid it names. Nothing redirects that file — the
      #     script's `MIMIC_DATABASE_PATH` isolates the store and not the discovery path. On a runner
      #     there is nothing else to hit; on a laptop the trap kills the developer's own Mimic, which
      #     is why `Scripts/ci.sh` does not run it either.
      #
      # The first two are fixable here — export `MIMIC_APP_PATH` and a products directory read out of
      # `xcodebuild -showBuildSettings` — but not verifiably without a Mac to run them on, and a step
      # that fails for its own reasons is worse than a missing one: it teaches people to ignore red.
      # The third belongs in `Scripts/run_cli_e2e.sh`, which should stop the pid it launched rather
      # than whatever the shared discovery file happens to name. Wire this up in that order.

      # Release compiles with whole-module optimisation and different warnings-as-errors, so it
      # catches things Debug does not. Run after the tests so a compile-only failure does not hide a
      # test result.
      - name: Build (Release)
        run: |
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic \
            -configuration Release CODE_SIGN_IDENTITY=- build

      # The result bundle is the only way to read a UI failure after the fact — it holds the failure
      # screenshots and the automatic UI hierarchy captures.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
