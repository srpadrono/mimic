name: CI

# Portable Swift runs on Linux. macOS builds the app and runs unit, CLI, Release, and UI gates.
# UI tests run on separate runners because they share a database, defaults, and window server.
# Build their portable test products once, then give each runner a small slice of the suite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: House rules
        run: |
          ./Scripts/check_house_rules.sh --self-test
          ./Scripts/check_house_rules.sh

      - name: Install SQLite headers and Python
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev python3-minimal

      - name: Swift version
        id: swift
        run: |
          swift --version
          echo "key=$(swift --version | head -1 | tr -c 'a-zA-Z0-9' '-' | tr -s '-')" >> "$GITHUB_OUTPUT"

      - name: Lockfiles agree
        run: python3 Scripts/check_lockfiles.py

      - name: Compiler settings
        run: python3 Scripts/check_compiler_settings.py

      - name: Module edges
        run: python3 Scripts/check_module_edges.py

      - name: Documentation and test targets
        run: |
          python3 Scripts/check_doc_counts.py --self-test
          python3 Scripts/check_doc_counts.py

      - name: UI shards cover every UI test method
        run: |
          python3 Scripts/check_ui_shards.py --self-test
          python3 Scripts/check_ui_shards.py

      - name: Coverage writer self-test
        run: python3 Scripts/update_readme_coverage.py --self-test

      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-${{ steps.swift.outputs.key }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-${{ steps.swift.outputs.key }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Package.resolved unchanged by the build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- Package.resolved || {
            echo "::error::swift build re-resolved Package.resolved (diff above). The versions this job tested are not the versions in the commit. Reproduce with 'swift build', commit the result, and move Tuist/Package.resolved with it — Scripts/check_lockfiles.py is what says whether they still agree."
            exit 1
          }

      - name: Test
        run: swift test --skip-build --no-parallel

  macos-checks:
    name: Build, unit suites, Release, CLI e2e (macOS)
    runs-on: macos-26
    timeout-minutes: 90

    env:
      DERIVED_DATA: .artifacts/DerivedData

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/macos-setup

      - name: Build (Debug)
        run: |
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY=- build

      - name: Test (unit suites)
        run: |
          rm -rf .artifacts/coverage
          mkdir -p .artifacts/coverage
          set -o pipefail
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic-Workspace \
            test -destination 'platform=macOS' -skip-testing:MimicUITests \
            -derivedDataPath "$DERIVED_DATA" \
            -enableCodeCoverage YES \
            -resultBundlePath .artifacts/coverage/UnitTests.xcresult \
            CODE_SIGN_IDENTITY=- 2>&1 | tee .artifacts/unit-tests.log

      - name: Coverage report
        continue-on-error: true
        run: |
          set -o pipefail
          python3 Scripts/update_readme_coverage.py \
            --result-bundle .artifacts/coverage/UnitTests.xcresult \
            --title 'Code coverage (unit suites, XCUITest excluded)' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package the coverage bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          tar -C .artifacts/coverage -czf .artifacts/UnitTests.xcresult.tar.gz UnitTests.xcresult
          ls -lh .artifacts/UnitTests.xcresult.tar.gz

      - name: Upload the coverage bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-bundle-unit
          path: .artifacts/UnitTests.xcresult.tar.gz
          retention-days: 1
          if-no-files-found: warn

      - name: CLI end-to-end (launch, discovery, real sockets)
        run: |
          products="$PWD/$DERIVED_DATA/Build/Products/Debug"
          if [ ! -x "$products/mimic" ] || [ ! -d "$products/Mimic.app" ]; then
            echo "::error::Debug products are not in $products — the Mimic scheme builds both Mimic.app and mimic, so this is a -derivedDataPath problem, not a test failure."
            ls -l "$products" || true
            exit 1
          fi
          export MIMIC_BIN="$products/mimic"
          export MIMIC_APP_PATH="$products/Mimic.app"
          ./Scripts/run_cli_e2e.sh

      - name: Pass-through end-to-end (synthetic HTTP)
        run: |
          products="$PWD/$DERIVED_DATA/Build/Products/Debug"
          python3 Scripts/test_passthrough_e2e.py --app "$products/Mimic.app" --cli "$products/mimic"

      - name: Build (Release)
        run: |
          set -o pipefail
          mkdir -p .artifacts
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic \
            -configuration Release -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY=- build \
            | tee .artifacts/release-build.log

      - name: Release warnings (reported, never a gate)
        continue-on-error: true
        run: |
          warnings="$(grep -E ': warning: ' .artifacts/release-build.log \
            | grep -vE 'SourcePackages/|Tuist/\.build/' | sort -u)"
          count="$(printf '%s\n' "$warnings" | grep -c . || true)"
          {
            echo "### Release warnings in first-party sources"
            echo
            echo "**$count** distinct warning line(s). This step never fails the run — see the"
            echo "comment above \`Build (Release)\` in \`.github/workflows/ci.yml\` for why"
            echo "warnings-as-errors is not switched on from the command line."
            if [ -n "$warnings" ]; then
              echo
              echo '```'
              printf '%s\n' "$warnings" | head -50
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test failure details
        if: failure()
        continue-on-error: true
        run: |
          ./Scripts/print_test_failures.sh \
            .artifacts/unit-tests.log \
            .artifacts/release-build.log \
            "$DERIVED_DATA"/Logs/Test/*.xcresult \
            .artifacts/coverage/*.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult-unit
          path: |
            ${{ env.DERIVED_DATA }}/Logs/Test/*.xcresult
            .artifacts/coverage/UnitTests.xcresult
          retention-days: 7
          if-no-files-found: ignore

  macos-ui-build:
    name: Build UI test products
    runs-on: macos-26
    timeout-minutes: 15

    env:
      DERIVED_DATA: .artifacts/DerivedData

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/macos-setup

      - name: Build for UI testing
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic \
            build-for-testing -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DERIVED_DATA" \
            -testProductsPath .artifacts/MimicUITests.xctestproducts \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY=-
          test -d .artifacts/MimicUITests.xctestproducts
          tar -C .artifacts -czf .artifacts/MimicUITests.xctestproducts.tar.gz \
            MimicUITests.xctestproducts

      - name: Upload UI test products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-products
          path: .artifacts/MimicUITests.xctestproducts.tar.gz
          retention-days: 1
          if-no-files-found: error

  macos-ui:
    name: UI tests (${{ matrix.name }})
    needs: macos-ui-build
    runs-on: macos-26
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1
            name: core window A
            only: >-
              -only-testing:MimicUITests/MimicUITests/testArrowKeysMoveThroughTheRequestLog
              -only-testing:MimicUITests/MimicUITests/testAutosaveIndicatorAppearsAfterEdit
              -only-testing:MimicUITests/MimicUITests/testCapturingSelectedRequestsAsJourney
              -only-testing:MimicUITests/MimicUITests/testClosingAProjectReturnsToWelcomeWithRecents
              -only-testing:MimicUITests/MimicUITests/testContextMenuOnRecentProject
              -only-testing:MimicUITests/MimicUITests/testCustomProjectPortPersistsAfterCloseAndReopen
              -only-testing:MimicUITests/MimicUITests/testDeleteProjectWithConfirmation
              -only-testing:MimicUITests/MimicUITests/testEditEndpointStatusCode
              -only-testing:MimicUITests/MimicUITests/testImportMenuOpensHARSheet
              -only-testing:MimicUITests/MimicUITests/testImportMenuOpensOpenAPISheet
              -only-testing:MimicUITests/MimicUITests/testRequestLogDrawerShowsHeaderAndEmptyState
              -only-testing:MimicUITests/MimicUITests/testReturnSubmitsNewProjectSheet
              -only-testing:MimicUITests/MimicUITests/testSelectingLoggedRequestShowsDetailInInspector
              -only-testing:MimicUITests/MimicUITests/testSwitchActiveScenarioViaClick
              -only-testing:MimicUITests/MimicUITests/testToggleDrawerPanel
              -only-testing:MimicUITests/MimicUITests/testWelcomeScreenShowsHeroAndButtons
              -only-testing:MimicUITests/MimicUITests/testWorkspaceShowsFourPanelLayout

          - id: 2
            name: core window B
            only: >-
              -only-testing:MimicUITests/MimicUITests/testCancelButtonDismissesNewProjectSheet
              -only-testing:MimicUITests/MimicUITests/testCaptureEvidenceScreenshots
              -only-testing:MimicUITests/MimicUITests/testCloseAndReopenProjectFromRecents
              -only-testing:MimicUITests/MimicUITests/testCreateEndpointViaToolbar
              -only-testing:MimicUITests/MimicUITests/testCreateNewProject
              -only-testing:MimicUITests/MimicUITests/testDefaultScenarioVisibleInInspector
              -only-testing:MimicUITests/MimicUITests/testDeleteEndpointWithConfirmation
              -only-testing:MimicUITests/MimicUITests/testDuplicateProject
              -only-testing:MimicUITests/MimicUITests/testDuplicateScenario
              -only-testing:MimicUITests/MimicUITests/testEndpointPersistsAfterCloseAndReopen
              -only-testing:MimicUITests/MimicUITests/testEndpointStatusCodePersistsAfterCloseAndReopen
              -only-testing:MimicUITests/MimicUITests/testEscapeDismissesNewProjectSheet
              -only-testing:MimicUITests/MimicUITests/testNewProjectOpensTheSheetAndLeavesTheProjectOpen
              -only-testing:MimicUITests/MimicUITests/testPortValidationShowsInlineError
              -only-testing:MimicUITests/MimicUITests/testProjectEndpointAndJourneySurviveAppRelaunch
              -only-testing:MimicUITests/MimicUITests/testSidebarSearchFiltersEndpoints
              -only-testing:MimicUITests/MimicUITests/testToggleInspectorPanel

          - id: 3
            name: journeys and spec import
            only: >-
              -only-testing:MimicUITests/JourneyUITests
              -only-testing:MimicUITests/SpecImportUITests

          - id: 4
            name: updates and backend settings
            only: >-
              -only-testing:MimicUITests/UpdateUITests
              -only-testing:MimicUITests/ControlPlaneIsolationTests
              -only-testing:MimicUITests/BackendSettingsUITests

          - id: 5
            name: workspace shell A
            only: >-
              -only-testing:MimicUITests/WorkspaceShellUITests/testClickingALoggedRequestOpensTheCollapsedInspector
              -only-testing:MimicUITests/WorkspaceShellUITests/testInspectorOverviewAnswersForTheProject
              -only-testing:MimicUITests/WorkspaceShellUITests/testInspectorTrafficTabListsTheEndpointsRequests
              -only-testing:MimicUITests/WorkspaceShellUITests/testJourneyCrumbJumpsToAnotherJourney
              -only-testing:MimicUITests/WorkspaceShellUITests/testMenuBarGuardsTheCommandsThatNeedAProject
              -only-testing:MimicUITests/WorkspaceShellUITests/testNarrowJumpBarCollapsesEarlierLocations
              -only-testing:MimicUITests/WorkspaceShellUITests/testOverviewReportsUnmatchedTrafficAndSurvivesAMultiRowSelection
              -only-testing:MimicUITests/WorkspaceShellUITests/testOverviewShowsTheActiveJourneyAndSwitchesTheNavigator
              -only-testing:MimicUITests/WorkspaceShellUITests/testPanelArrangementSurvivesClosingAndReopeningTheProject
              -only-testing:MimicUITests/WorkspaceShellUITests/testPanelChordsToggleBothPanels
              -only-testing:MimicUITests/WorkspaceShellUITests/testScenarioCrumbSwitchesTheActiveScenario
              -only-testing:MimicUITests/WorkspaceShellUITests/testStartingOnAnOccupiedPortOffersTheNextPort
              -only-testing:MimicUITests/WorkspaceShellUITests/testToolbarPreservesIdentityAndCollapsesSecondaryActions
              -only-testing:MimicUITests/WorkspaceShellUITests/testWorkspaceShellNamesItsWindowAndFourPanels

          - id: 6
            name: workspace shell B
            only: >-
              -only-testing:MimicUITests/WorkspaceShellUITests/testAutosaveIndicatorClearsOnceTheSaveSettles
              -only-testing:MimicUITests/WorkspaceShellUITests/testAutosaveReportsAStoreThatRefusesTheWrite
              -only-testing:MimicUITests/WorkspaceShellUITests/testEndpointCrumbJumpsToASibling
              -only-testing:MimicUITests/WorkspaceShellUITests/testGroupCrumbJumpsToAnotherGroup
              -only-testing:MimicUITests/WorkspaceShellUITests/testJourneyRunCommandsAreDisabledWithoutAnActiveJourney
              -only-testing:MimicUITests/WorkspaceShellUITests/testJourneysMenuDrivesTheActiveJourney
              -only-testing:MimicUITests/WorkspaceShellUITests/testJumpBarHistoryWalksBackAndForward
              -only-testing:MimicUITests/WorkspaceShellUITests/testJumpBarNamesTheProjectAndHasNowhereToGoYet
              -only-testing:MimicUITests/WorkspaceShellUITests/testNavigatorTabStripSwitchesTheNavigatorAndCentrePane
              -only-testing:MimicUITests/WorkspaceShellUITests/testReselectingTheSameEndpointStacksNoHistory
              -only-testing:MimicUITests/WorkspaceShellUITests/testSelectingAfterGoingBackDiscardsTheForwardStack
              -only-testing:MimicUITests/WorkspaceShellUITests/testServerMenuStartsStopsAndFlipsItsTitle
              -only-testing:MimicUITests/WorkspaceShellUITests/testServerWellReportsItsStateAndCopiesTheAddress
              -only-testing:MimicUITests/WorkspaceShellUITests/testUnmatchedBadgeOpensTheLogFilteredToUnmatched
              -only-testing:MimicUITests/WorkspaceShellUITests/testViewMenuAndShortcutSwitchNavigators

          - id: 7
            name: welcome projects
            only: >-
              -only-testing:MimicUITests/WelcomeProjectUITests

          - id: 8
            name: request log
            only: >-
              -only-testing:MimicUITests/RequestLogUITests

          - id: 9
            name: navigator
            only: >-
              -only-testing:MimicUITests/NavigatorUITests

          - id: 10
            name: endpoint editor A
            only: >-
              -only-testing:MimicUITests/EndpointEditorUITests/testCompactEditorMoreMenuRespondsAtEdgeInDarkAppearance
              -only-testing:MimicUITests/EndpointEditorUITests/testDeleteScenarioIsDisabledForTheOnlyScenarioAndRemovesOneOfSeveral
              -only-testing:MimicUITests/EndpointEditorUITests/testEditorDeleteConfirmationCancelKeepsTheEndpoint
              -only-testing:MimicUITests/EndpointEditorUITests/testEndpointDelayCommitsOnBlurAndRejectsANonNumericValue
              -only-testing:MimicUITests/EndpointEditorUITests/testFilterClearButtonRestoresTheListAfterANoMatchesQuery
              -only-testing:MimicUITests/EndpointEditorUITests/testGlobalDelayRowIsReadOnlyAndExplainsItself
              -only-testing:MimicUITests/EndpointEditorUITests/testGroupTagGathersTheEndpointIntoASidebarSection
              -only-testing:MimicUITests/EndpointEditorUITests/testInvalidJSONBodyWarnsAndDisablesFormat
              -only-testing:MimicUITests/EndpointEditorUITests/testMethodPickerCreatesAPostEndpoint
              -only-testing:MimicUITests/EndpointEditorUITests/testPrettyPrintFormatsTheJSONBodyAndTheResultPersists
              -only-testing:MimicUITests/EndpointEditorUITests/testScalarJSONBodyClearsWarningWithoutEnablingFormat
              -only-testing:MimicUITests/EndpointEditorUITests/testScenarioRowAnnouncesItsStatusCodeAndTracksEdits
              -only-testing:MimicUITests/EndpointEditorUITests/testSidebarContextMenuDuplicatesAnEndpoint

          - id: 11
            name: endpoint editor B
            only: >-
              -only-testing:MimicUITests/EndpointEditorUITests/testAGroupSectionKeepsItsEndpointListedWhileASiblingIsEdited
              -only-testing:MimicUITests/EndpointEditorUITests/testActivatingAScenarioMovesTheActiveMarkerOffThePreviousOne
              -only-testing:MimicUITests/EndpointEditorUITests/testAddScenarioSheetAddsAScenarioToTheInspectorList
              -only-testing:MimicUITests/EndpointEditorUITests/testAddingAResponseHeaderCommitsAndSurvivesReopening
              -only-testing:MimicUITests/EndpointEditorUITests/testEditorMoreMenuDuplicatesTheEndpoint
              -only-testing:MimicUITests/EndpointEditorUITests/testEmptyStateAndNavigatorAddEndpointButtonsAreDistinct
              -only-testing:MimicUITests/EndpointEditorUITests/testFormatStaysDisabledWhenValidDeepJSONExceedsOutputBudget
              -only-testing:MimicUITests/EndpointEditorUITests/testMethodScopeFilterRestrictsTheListAndNamesTheEmptyScope
              -only-testing:MimicUITests/EndpointEditorUITests/testNewEndpointSheetCancelsAndSubmitsOnReturn
              -only-testing:MimicUITests/EndpointEditorUITests/testNewEndpointSheetRejectsAPathWithoutALeadingSlash
              -only-testing:MimicUITests/EndpointEditorUITests/testNewScenarioSheetCancelsAndSubmitsOnReturn
              -only-testing:MimicUITests/EndpointEditorUITests/testRemovingAMiddleHeaderRowKeepsTheOthersIntact
              -only-testing:MimicUITests/EndpointEditorUITests/testSidebarContextMenuDeleteConfirmationNamesTheEndpoint
              -only-testing:MimicUITests/EndpointEditorUITests/testStatusCodeValidationNotesExplainWhyACodeWasRejected

          - id: 12
            name: alerts
            only: >-
              -only-testing:MimicUITests/ErrorAlertUITests

          - id: 13
            name: journey editor A
            only: >-
              -only-testing:MimicUITests/JourneyEditorUITests/testEditingAStepLoadsItsValuesAndSavesInPlace
              -only-testing:MimicUITests/JourneyEditorUITests/testNewJourneySheetExplainsItselfAndCreatesOnReturn
              -only-testing:MimicUITests/JourneyEditorUITests/testRunControlsAdvanceToCompletionAndRestart
              -only-testing:MimicUITests/JourneyEditorUITests/testStepSheetAuthorsARespondStepWithMethodHeadersAndBody
              -only-testing:MimicUITests/JourneyEditorUITests/testStepsEmptyStateAddsTheFirstStep
              -only-testing:MimicUITests/JourneyEditorUITests/testTemplateActivateToggleDecidesWhetherTheJourneyStartsAnswering
              -only-testing:MimicUITests/JourneyEditorUITests/testTemplateShelfListsEveryTemplateAndCancels

          - id: 14
            name: journey editor B
            only: >-
              -only-testing:MimicUITests/JourneyEditorUITests/testBehaviourControlsChangeTheJourneyAndSurviveReselection
              -only-testing:MimicUITests/JourneyEditorUITests/testDeleteJourneyConfirmsFirstAndCanBeCalledOff
              -only-testing:MimicUITests/JourneyEditorUITests/testDuplicateJourneyFromTheRowContextMenu
              -only-testing:MimicUITests/JourneyEditorUITests/testNavigatorIndicatorRevealsTheActiveJourneyWithoutChangingTheRun
              -only-testing:MimicUITests/JourneyEditorUITests/testOutcomePickerSwapsTheFieldsAndAuthorsADroppedConnection
              -only-testing:MimicUITests/JourneyEditorUITests/testStepContextMenuReordersAndRemovesSteps
              -only-testing:MimicUITests/JourneyEditorUITests/testStepSheetKeepsSaveDisabledUntilAPathIsTypedAndCancelsCleanly
              -only-testing:MimicUITests/JourneyEditorUITests/testStepSheetNamesTheRuleThatRefusedEachTime

    env:
      DERIVED_DATA: .artifacts/DerivedData

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Allow UI automation without an interactive prompt
        run: sudo automationmodetool enable-automationmode-without-authentication

      - name: Download UI test products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-test-products
          path: .artifacts/download

      - name: Restore UI test products
        run: |
          set -euo pipefail
          tar -C .artifacts -xzf .artifacts/download/MimicUITests.xctestproducts.tar.gz
          test -d .artifacts/MimicUITests.xctestproducts

      - name: Test (UI)
        env:
          ONLY_TESTING: ${{ matrix.only }}
          RESULT_BUNDLE: .artifacts/ui/UITests-${{ matrix.id }}.xcresult
          BUILD_LOG: .artifacts/ui-tests-${{ matrix.id }}.log
        run: |
          set -o pipefail
          rm -rf "$RESULT_BUNDLE"
          mkdir -p .artifacts/ui
          xcodebuild test-without-building \
            -testProductsPath .artifacts/MimicUITests.xctestproducts \
            -destination 'platform=macOS,arch=arm64' \
            $ONLY_TESTING \
            -derivedDataPath "$DERIVED_DATA" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGN_IDENTITY=- 2>&1 | tee "$BUILD_LOG"

      - name: Test failure details
        if: failure()
        continue-on-error: true
        env:
          RESULT_BUNDLE: .artifacts/ui/UITests-${{ matrix.id }}.xcresult
          BUILD_LOG: .artifacts/ui-tests-${{ matrix.id }}.log
        run: |
          ./Scripts/print_test_failures.sh \
            "$BUILD_LOG" \
            "$RESULT_BUNDLE" \
            "$DERIVED_DATA"/Logs/Test/*.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult-ui-${{ matrix.id }}
          path: |
            .artifacts/ui/UITests-${{ matrix.id }}.xcresult
            .artifacts/ui-tests-${{ matrix.id }}.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Package the coverage bundle
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          BUNDLE_NAME: UITests-${{ matrix.id }}.xcresult
        run: |
          set -euo pipefail
          if [ ! -d ".artifacts/ui/$BUNDLE_NAME" ]; then
            echo "::warning::No result bundle at .artifacts/ui/$BUNDLE_NAME — this shard died before xcodebuild wrote one, so the coverage job will reject the incomplete bundle set."
            exit 0
          fi
          tar -C .artifacts/ui -czf ".artifacts/$BUNDLE_NAME.tar.gz" "$BUNDLE_NAME"
          ls -lh ".artifacts/$BUNDLE_NAME.tar.gz"

      - name: Upload the coverage bundle
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-bundle-ui-${{ matrix.id }}
          path: .artifacts/UITests-${{ matrix.id }}.xcresult.tar.gz
          retention-days: 1
          if-no-files-found: warn

  ui-suite:
    name: UI suite
    needs: macos-ui
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verdict
        env:
          RESULT: ${{ needs.macos-ui.result }}
        run: |
          set -euo pipefail
          echo "The UI shards rolled up to: $RESULT"
          case "$RESULT" in
            success)
              echo "All UI shards passed."
              ;;
            skipped)
              echo "::error::The UI shards did not run, so nothing exercised the window on this commit."
              exit 1
              ;;
            *)
              echo "::error::At least one UI shard is red. Open the run page: each shard uploads its own xcresult-ui-N artifact. Read the failing shard's 'Test failure details' step first."
              exit 1
              ;;
          esac

  coverage:
    name: Coverage (unit suites + XCUITest)
    needs: [macos-checks, macos-ui]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 30

    outputs:
      coverage: ${{ steps.figures.outputs.json }}

    env:
      EXPECTED_COVERAGE_BUNDLES: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the result bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-bundle-*
          merge-multiple: true
          path: .artifacts/download

      - name: Merge the result bundles
        id: merge
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p .artifacts/bundles .artifacts/merged

          for tarball in .artifacts/download/*.tar.gz; do
            [ -f "$tarball" ] || continue
            tar -C .artifacts/bundles -xzf "$tarball" || exit 1
            rm -f "$tarball"
          done

          found="$(find .artifacts/bundles -maxdepth 1 -name '*.xcresult' | sort)"
          count="$(printf '%s\n' "$found" | grep -c . || true)"
          echo "Found $count result bundle(s), expected $EXPECTED_COVERAGE_BUNDLES:"
          printf '%s\n' "$found"

          if [ "$count" -ne "$EXPECTED_COVERAGE_BUNDLES" ]; then
            {
              echo '### Coverage not published on this commit'
              echo
              echo "The merge needs $EXPECTED_COVERAGE_BUNDLES result bundles — one from the unit"
              echo "suites and one from each UI shard — and $count arrived. A union missing a"
              echo 'shard would publish a lower number with nothing to say a shard is missing, so'
              echo 'nothing is published and the badges go on showing the last figures that were.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Only $count of $EXPECTED_COVERAGE_BUNDLES coverage bundles arrived — nothing published."
            echo "state=short" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! xcrun xcresulttool merge $found --output-path .artifacts/merged/Coverage.xcresult; then
            {
              echo '### Coverage not published on this commit'
              echo
              echo '`xcrun xcresulttool merge` failed. It is the one command in this job whose'
              echo 'behaviour could not be checked before it landed, so this is a warning and not a'
              echo 'red X — the badges go on showing the last figures that were published. Read the'
              echo '`Merge the result bundles` step for what it said.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::xcresulttool merge failed — nothing published."
            echo "state=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          find .artifacts/bundles -maxdepth 1 -name 'UITests-*.xcresult' -exec rm -rf {} +
          echo "state=ready" >> "$GITHUB_OUTPUT"

      - name: Coverage report (unit suites only, for comparison)
        if: steps.merge.outputs.state == 'ready'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 Scripts/update_readme_coverage.py \
            --result-bundle .artifacts/bundles/UnitTests.xcresult \
            --title 'Code coverage — unit suites alone (the previous basis for the badges)' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Coverage report (merged)
        if: steps.merge.outputs.state == 'ready'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 Scripts/update_readme_coverage.py \
            --result-bundle .artifacts/merged/Coverage.xcresult \
            --title 'Code coverage — unit suites and XCUITest, merged (what the badges publish)' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Emit coverage figures
        id: figures
        if: steps.merge.outputs.state == 'ready'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 Scripts/update_readme_coverage.py \
            --result-bundle .artifacts/merged/Coverage.xcresult \
            --emit-json .artifacts/coverage.json
          cat .artifacts/coverage.json
          {
            echo 'json<<COVERAGE_JSON_EOF'
            cat .artifacts/coverage.json
            echo 'COVERAGE_JSON_EOF'
          } >> "$GITHUB_OUTPUT"

  record-coverage:
    name: Publish coverage badges
    needs: coverage
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the figures out
        id: figures
        env:
          COVERAGE_JSON: ${{ needs.coverage.outputs.coverage }}
        run: |
          set -euo pipefail
          if [ -z "${COVERAGE_JSON:-}" ]; then
            echo "No coverage figures in this run: the coverage job did not reach the measurement."
            echo "state=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .artifacts/coverage
          printf '%s\n' "$COVERAGE_JSON" > .artifacts/coverage/coverage.json
          echo "state=ready" >> "$GITHUB_OUTPUT"

      - name: Publish the badge payloads
        if: steps.figures.outputs.state == 'ready'
        continue-on-error: true
        run: |
          set -euo pipefail

          branch="$(python3 Scripts/update_readme_coverage.py --print-badge-branch)"

          badges="$(mktemp -d)"
          python3 Scripts/update_readme_coverage.py \
            --from-json .artifacts/coverage/coverage.json \
            --emit-badges "$badges"

          {
            echo '### Coverage badge payloads'
            echo
            echo "Measured on this commit and force-pushed to the \`$branch\` branch, where"
            echo 'shields.io reads them for the two badges at the top of README.md. If the push'
            echo 'below failed, the badges still show the last figures that were published and'
            echo 'these are the ones they would have shown.'
            for payload in "$badges"/*.json; do
              echo
              echo "\`$(basename "$payload")\`:"
              echo
              echo '```json'
              cat "$payload"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout --quiet --orphan "$branch"
          git rm -r --quiet --cached .
          cp "$badges"/*.json .
          git add app-coverage.json module-coverage.json
          git commit --quiet -m 'chore: publish measured coverage as badge endpoints'

          git push --force origin "HEAD:refs/heads/$branch"
          echo "Published to $branch."
