name: CI

# Portable Swift runs on Linux. macOS builds the app and runs unit, CLI, Release, and UI gates.
# UI tests run on separate runners because they share a database, defaults, and window server.
# Build their portable test products once, then give each runner a small slice of the suite.
#
# Pull requests and pushes run only what the change can break: the `plan` job
# (Scripts/select_tests.py) picks the unit test targets and UI shards from the files changed. The
# account gets five macOS runners at a time, so every shard a change does not need is time the next
# run does not queue. The full suite and the coverage badges run nightly, and on any change to build
# settings, this workflow or the selection script; the Release build runs nightly, on a manual full
# run, and on a change to build settings. A push that only approves gallery snapshots keeps the UI
# verdict its pull request's previous head earned.
#
# Pull requests and pushes run a failing test a second time, so one transient failure does not cost
# an hour-long re-run; Scripts/report_flaky_tests.py names every test that needed it, on the run page
# and in the UI suite's summary. The nightly never retries, so it still counts flakes. Every test has
# an execution time allowance, so a hung app fails one test instead of stalling a job until it is
# killed with no evidence.
#
# A manual run can ask for the full suite, or name UI tests in `only_testing` to reproduce a failure
# on one runner, repeated until it fails with `iterations`. Its check runs carry other names, so a
# focus run can never stand in for a pull request's required checks.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Run every unit suite, every UI shard and the Release build
        type: boolean
        default: false
      only_testing:
        description: "UI tests to run alone, space separated (Class or Class/testMethod)"
        type: string
        default: ""
      iterations:
        description: Repeat the only_testing selection until it fails, up to this many times
        type: number
        default: 1

permissions:
  contents: read

env:
  # The Xcode every macOS job builds and tests with: .github/actions/macos-setup selects it for the
  # build jobs and the UI shard job selects it itself. The folder is /Applications/Xcode_<this>.app
  # on GitHub's macos-26 image. Moving it changes font rasterisation, so expect to record the gallery
  # snapshots again.
  XCODE_VERSION: "26.6"

concurrency:
  # The nightly has a group of its own. It shares github.ref with main's pushes, so it used to queue
  # behind them, and a pending run in a group is replaced by the next one to arrive.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan the tests this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads whether an earlier head of this pull request passed the UI suite; see the step.
      checks: read

    outputs:
      full: ${{ steps.select.outputs.full }}
      checks: ${{ steps.select.outputs.checks }}
      unit: ${{ steps.select.outputs.unit }}
      unit_extra: ${{ steps.select.outputs.unit_extra }}
      ui: ${{ steps.select.outputs.ui }}
      ui_matrix: ${{ steps.select.outputs.ui_matrix }}
      release: ${{ steps.select.outputs.release }}
      coverage: ${{ steps.select.outputs.coverage }}
      expected_bundles: ${{ steps.select.outputs.expected_bundles }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select tests
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          # The commit before this push: the previous head of a pull request (on a new push to it),
          # or main before the merge.
          BEFORE: ${{ github.event.before }}
          FULL: ${{ inputs.full }}
          ONLY_TESTING: ${{ inputs.only_testing }}
          ITERATIONS: ${{ inputs.iterations }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--event "$EVENT" --ref "$REF" --only-testing "${ONLY_TESTING:-}" --iterations "${ITERATIONS:-1}")
          case "$EVENT" in
            pull_request)
              args+=(--base "$PR_BASE" --head "$PR_HEAD")
              # Approving gallery snapshots is a push of PNGs. When the previous head passed the UI
              # suite, select_tests.py keeps that verdict if nothing but snapshots changed since; it
              # checks that itself. Any doubt (no previous head, an API error) runs the UI as usual.
              if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$PR_HEAD" ]; then
                passed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BEFORE/check-runs?check_name=UI%20suite&filter=latest" \
                  --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || true)"
                case "$passed" in
                  ''|*[!0-9]*) passed=0 ;;
                esac
                if [ "$passed" -gt 0 ]; then
                  args+=(--ui-passed-at "$BEFORE")
                fi
              fi
              ;;
            push) args+=(--base "${BEFORE:-}" --head "$GITHUB_SHA") ;;
          esac
          if [ "$EVENT" = workflow_dispatch ] && [ "${FULL:-false}" = true ]; then
            args+=(--full)
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ -z "${ONLY_TESTING:-}" ] && [ "${FULL:-false}" != true ]; then
            # A manual run with nothing chosen is a full run of the ref it was started on.
            args+=(--full)
          fi
          python3 Scripts/select_tests.py "${args[@]}"

  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # An exact release: a moving tag changes the compiler under an unchanged commit. 6.2 is the floor
    # the portable modules promise; macOS builds with the newer Swift its Xcode carries.
    container: swift:6.2.4

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: House rules
        run: |
          ./Scripts/check_house_rules.sh --self-test
          ./Scripts/check_house_rules.sh

      - name: Install SQLite headers and Python
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev python3

      - name: Script regressions
        run: python3 -m unittest discover -s Scripts/tests -p 'test_*.py'

      - name: Swift version
        id: swift
        run: |
          swift --version
          echo "key=$(swift --version | head -1 | tr -c 'a-zA-Z0-9' '-' | tr -s '-')" >> "$GITHUB_OUTPUT"

      - name: Lockfiles agree
        run: python3 Scripts/check_lockfiles.py --self-test

      - name: Compiler settings
        run: python3 Scripts/check_compiler_settings.py --self-test

      - name: Module edges
        run: python3 Scripts/check_module_edges.py --self-test

      - name: Documentation and test targets
        run: |
          python3 Scripts/check_doc_counts.py --self-test
          python3 Scripts/check_doc_counts.py

      - name: UI shards cover every UI test method
        run: |
          python3 Scripts/check_ui_shards.py --self-test
          python3 Scripts/check_ui_shards.py

      - name: Test selection covers every module
        run: |
          python3 Scripts/select_tests.py --self-test
          python3 Scripts/select_tests.py --check

      - name: Coverage writer self-test
        run: python3 Scripts/update_readme_coverage.py --self-test

      - name: Layout audit report self-test
        run: python3 Scripts/layout_audit_report.py --self-test

      - name: Flaky test reporter self-test
        run: python3 Scripts/report_flaky_tests.py --self-test

      # Restored everywhere, saved only from main and the nightly: a pull request's entry is readable
      # by that pull request alone, and at about 1 GB each they evicted the entries every run reads.
      - name: Restore SwiftPM dependencies
        id: spm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-${{ steps.swift.outputs.key }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-${{ steps.swift.outputs.key }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Save SwiftPM dependencies
        if: github.event_name != 'pull_request' && steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Package.resolved unchanged by the build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- Package.resolved || {
            echo "::error::swift build re-resolved Package.resolved (diff above). The versions this job tested are not the versions in the commit. Reproduce with 'swift build', commit the result, and move Tuist/Package.resolved with it — Scripts/check_lockfiles.py is what says whether they still agree."
            exit 1
          }

      - name: Test
        run: swift test --skip-build --no-parallel

  # A change that needs no macOS checks skips this job, and so does a focus run. Its own name is not
  # the required check: `macos-checks-verdict` below carries that, because a skipped job's `name:`
  # expression is never evaluated and the check would be reported under the literal expression.
  macos-checks:
    name: macOS build, unit suites, Release and CLI e2e
    needs: plan
    if: needs.plan.outputs.checks == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      snapshots: ${{ steps.snapshots.outputs.found }}

    env:
      DERIVED_DATA: .artifacts/DerivedData

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Script regressions (including macOS packaging fixtures)
        run: python3 -m unittest discover -s Scripts/tests -p 'test_*.py'

      - uses: ./.github/actions/macos-setup

      - name: Build (Debug)
        run: |
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY=- build

      - name: Test (unit suites)
        if: needs.plan.outputs.unit != 'none'
        env:
          UNIT: ${{ needs.plan.outputs.unit }}
          # One retry on pull requests and pushes, none nightly; see the flaky test step below.
          EXTRA: ${{ needs.plan.outputs.unit_extra }}
          # GallerySnapshotTests writes new and changed renderings here; see the upload below.
          TEST_RUNNER_MIMIC_SNAPSHOT_OUTPUT: ${{ github.workspace }}/.artifacts/snapshots
          # The design fidelity report takes two and a half minutes and gates nothing, so it runs on
          # full runs only, which upload it. Empty, the test skips itself.
          TEST_RUNNER_MIMIC_FIDELITY_REPORT: ${{ needs.plan.outputs.full == 'true' && format('{0}/.artifacts/fidelity', github.workspace) || '' }}
        run: |
          rm -rf .artifacts/coverage
          mkdir -p .artifacts/coverage
          set -o pipefail
          if [ "$UNIT" = all ]; then
            selection="-skip-testing:MimicUITests"
          else
            selection="$UNIT"
          fi
          echo "Unit selection: $selection"
          # $selection and $EXTRA are unquoted on purpose: each is several flags. The allowances fail
          # a hung test after five minutes (the slowest takes under three) instead of letting it run
          # into the job's timeout.
          # shellcheck disable=SC2086
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic-Workspace \
            test -destination 'platform=macOS' $selection $EXTRA \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            -derivedDataPath "$DERIVED_DATA" \
            -enableCodeCoverage YES \
            -resultBundlePath .artifacts/coverage/UnitTests.xcresult \
            CODE_SIGN_IDENTITY=- 2>&1 | tee .artifacts/unit-tests.log

      - name: Flaky tests (unit suites)
        if: ${{ !cancelled() && needs.plan.outputs.unit != 'none' }}
        continue-on-error: true
        run: python3 Scripts/report_flaky_tests.py --label 'unit suites' .artifacts/coverage/UnitTests.xcresult

      - name: Upload the design fidelity report
        if: ${{ !cancelled() && needs.plan.outputs.full == 'true' && hashFiles('.artifacts/fidelity/**') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fidelity-report
          path: .artifacts/fidelity
          retention-days: 7
          if-no-files-found: ignore

      # Gallery snapshots that are new or no longer match their baseline. `publish-snapshots` puts
      # them on a git branch; approved ones are committed to Tests/DesignFidelityTests/Snapshots.
      - name: Find new and changed snapshots
        id: snapshots
        if: ${{ !cancelled() && needs.plan.outputs.unit != 'none' }}
        run: |
          if [ -n "$(find .artifacts/snapshots -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload new and changed snapshots
        if: ${{ !cancelled() && needs.plan.outputs.unit != 'none' && hashFiles('.artifacts/snapshots/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshots
          path: .artifacts/snapshots
          retention-days: 14
          if-no-files-found: ignore

      - name: Coverage report
        if: needs.plan.outputs.unit != 'none'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 Scripts/update_readme_coverage.py \
            --result-bundle .artifacts/coverage/UnitTests.xcresult \
            --title 'Code coverage (unit suites, XCUITest excluded)' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package the coverage bundle
        if: needs.plan.outputs.coverage == 'true'
        run: |
          set -euo pipefail
          tar -C .artifacts/coverage -czf .artifacts/UnitTests.xcresult.tar.gz UnitTests.xcresult
          ls -lh .artifacts/UnitTests.xcresult.tar.gz

      # The coverage job counts the bundles it receives and publishes nothing from an incomplete set,
      # so a failed upload costs that night's badges, never a red check.
      - name: Upload the coverage bundle
        if: needs.plan.outputs.coverage == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-bundle-unit
          path: .artifacts/UnitTests.xcresult.tar.gz
          retention-days: 1
          if-no-files-found: warn

      - name: CLI end-to-end (launch, discovery, real sockets)
        run: |
          products="$PWD/$DERIVED_DATA/Build/Products/Debug"
          if [ ! -x "$products/mimic" ] || [ ! -d "$products/Mimic.app" ]; then
            echo "::error::Debug products are not in $products — the Mimic scheme builds both Mimic.app and mimic, so this is a -derivedDataPath problem, not a test failure."
            ls -l "$products" || true
            exit 1
          fi
          export MIMIC_BIN="$products/mimic"
          export MIMIC_APP_PATH="$products/Mimic.app"
          ./Scripts/run_cli_e2e.sh

      - name: Pass-through end-to-end (synthetic HTTP)
        run: |
          products="$PWD/$DERIVED_DATA/Build/Products/Debug"
          python3 Scripts/test_passthrough_e2e.py --app "$products/Mimic.app" --cli "$products/mimic"

      # The Release build has not failed on its own in the history this selection was based on, and
      # it is the slowest step (15 to 23 minutes). It runs nightly, on a manual full run, and on a
      # change to build settings, Tuist or a vendored manifest (`release_paths`), not on every full
      # run. A change to these two steps themselves first runs on the next nightly; start a full
      # run by hand to try it sooner.
      - name: Build (Release)
        if: needs.plan.outputs.release == 'true'
        run: |
          set -o pipefail
          mkdir -p .artifacts
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic \
            -configuration Release -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY=- build \
            2>&1 | tee .artifacts/release-build.log

      - name: Release warnings (reported, never a gate)
        if: needs.plan.outputs.release == 'true'
        continue-on-error: true
        run: |
          warnings="$(grep -E ': warning: ' .artifacts/release-build.log \
            | grep -vE 'SourcePackages/|Tuist/\.build/' | sort -u || true)"
          count="$(printf '%s\n' "$warnings" | grep -c . || true)"
          {
            echo "### Release warnings in first-party sources"
            echo
            echo "**$count** distinct warning line(s). This report is informational;"
            echo 'compiler warning policy comes from the project settings.'
            if [ -n "$warnings" ]; then
              echo
              echo '```'
              printf '%s\n' "$warnings" | head -50
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # `cancelled()` too: a job that runs into its timeout is cancelled, not failed, and that is
      # exactly the run whose evidence matters most.
      - name: Test failure details
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        run: |
          ./Scripts/print_test_failures.sh \
            .artifacts/unit-tests.log \
            .artifacts/release-build.log \
            "$DERIVED_DATA"/Logs/Test/*.xcresult \
            .artifacts/coverage/*.xcresult

      - name: Upload test results
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult-unit
          path: |
            ${{ env.DERIVED_DATA }}/Logs/Test/*.xcresult
            .artifacts/coverage/UnitTests.xcresult
          retention-days: 7
          if-no-files-found: ignore

  # A required status check, standing in for `macos-checks`: it passes when that job passed, or when
  # the plan selected no macOS checks. It always runs, as `ui-suite` does, because GitHub leaves a
  # skipped job's `name:` expression unevaluated, and the required check would then never report and
  # leave the pull request blocked. A focus run's verdict carries another name, so its pass can never
  # stand in for a pull request's macOS checks.
  macos-checks-verdict:
    name: ${{ inputs.only_testing && 'macOS checks (not run in a focus run)' || 'Build, unit suites, Release, CLI e2e (macOS)' }}
    needs: [plan, macos-checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verdict
        env:
          PLAN: ${{ needs.plan.result }}
          WANTED: ${{ needs.plan.outputs.checks }}
          RESULT: ${{ needs.macos-checks.result }}
        run: |
          set -euo pipefail
          if [ "$PLAN" != success ]; then
            echo "::error::The plan job did not finish ($PLAN), so nobody knows which macOS checks this change needs."
            exit 1
          fi
          if [ "$WANTED" != true ]; then
            echo "The plan selected no macOS checks for this change; its summary says why."
            exit 0
          fi
          if [ "$RESULT" != success ]; then
            echo "::error::The macOS checks job finished $RESULT. Open its 'Test failure details' step first."
            exit 1
          fi
          echo "The macOS checks passed."

  # Artifacts need a browser or the Actions API to download. A branch is one `git fetch` away, so
  # new and changed gallery snapshots are also force-pushed to `snapshots/<branch>`, laid out as
  # they would be committed. Pushes made with GITHUB_TOKEN start no workflow runs.
  publish-snapshots:
    name: Publish new and changed snapshots
    needs: [plan, macos-checks]
    if: >-
      ${{ !cancelled() && needs.macos-checks.outputs.snapshots == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the snapshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots

      - name: Push them to a branch
        env:
          SOURCE: ${{ runner.temp }}/snapshots
          BRANCH: snapshots/${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout --quiet --orphan "$BRANCH"
          git rm -r --quiet --cached .
          git clean -fdxq
          mkdir -p Tests/DesignFidelityTests/Snapshots
          for kind in new changed; do
            if [ -d "$SOURCE/$kind" ]; then
              cp "$SOURCE/$kind"/*.png Tests/DesignFidelityTests/Snapshots/
            fi
          done
          if [ -d "$SOURCE/difference" ]; then
            mkdir -p Differences
            cp "$SOURCE/difference"/*.png Differences/
          fi
          git add -A
          git commit --quiet -m "chore: snapshots rendered for $GITHUB_SHA"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          {
            echo '### New and changed gallery snapshots'
            echo
            echo "Pushed to \`$BRANCH\` ($(git ls-files Tests | wc -l | tr -d ' ') renderings). To approve them:"
            echo
            echo '```sh'
            echo "git fetch origin $BRANCH"
            echo "git checkout FETCH_HEAD -- Tests/DesignFidelityTests/Snapshots"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  macos-ui-build:
    name: Build UI test products
    needs: plan
    if: needs.plan.outputs.ui == 'true'
    runs-on: macos-26
    # The build has taken up to 19.5 minutes, and a Tuist cache miss adds several more.
    timeout-minutes: 40

    env:
      DERIVED_DATA: .artifacts/DerivedData
      # Instrumented only when the coverage badges are published (the nightly). The Mimic scheme turns
      # coverage on by default, so NO has to be said.
      COVERAGE: ${{ needs.plan.outputs.coverage == 'true' && 'YES' || 'NO' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/macos-setup

      - name: Build for UI testing
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          xcodebuild -workspace Mimic.xcworkspace -scheme Mimic \
            build-for-testing -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DERIVED_DATA" \
            -testProductsPath .artifacts/MimicUITests.xctestproducts \
            -enableCodeCoverage "$COVERAGE" \
            CODE_SIGN_IDENTITY=-
          test -d .artifacts/MimicUITests.xctestproducts
          tar -C .artifacts -czf .artifacts/MimicUITests.xctestproducts.tar.gz \
            MimicUITests.xctestproducts

      # Kept three days so "Re-run failed jobs" still finds them after a weekend.
      - name: Upload UI test products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-products
          path: .artifacts/MimicUITests.xctestproducts.tar.gz
          retention-days: 3
          if-no-files-found: error

  macos-ui:
    name: UI tests (${{ matrix.name }})
    needs: [plan, macos-ui-build]
    if: needs.plan.outputs.ui == 'true'
    runs-on: macos-26
    # A manual focus run (id 99) may repeat its tests many times.
    timeout-minutes: ${{ matrix.id == 99 && 120 || 30 }}

    # The shards, and which ones a change needs, come from Scripts/test_selection.json through the
    # plan job, longest first. Scripts/check_ui_shards.py holds every UI test method to exactly one
    # shard. Each leg carries its `-only-testing:` selectors, its retry flags (`extra`; none nightly
    # or for an audit shard, repeat-until-failure for a focus run) and its per-test `allowance`.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.ui_matrix) }}

    env:
      DERIVED_DATA: .artifacts/DerivedData
      COVERAGE: ${{ needs.plan.outputs.coverage == 'true' && 'YES' || 'NO' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same Xcode the products were built with (macos-setup selects it there), and the display
      # the layouts were measured on. CI's runners have a 1024x768 display, whose visible frame is
      # 1024x677; the UI tests pin the app to that frame on every machine, and this line is what
      # says so when an image change moves it.
      - name: Select the pinned Xcode and print the display
        run: |
          set -euo pipefail
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            installed="$(printf '%s ' /Applications/Xcode*.app)"
            echo "::error::$app is not on runner image ${ImageVersion:-unknown}. It has: $installed. Move XCODE_VERSION in .github/workflows/ci.yml to one of them."
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version
          echo "Runner image ${ImageVersion:-unknown}"
          system_profiler SPDisplaysDataType | grep -E 'Resolution|UI Looks like' || true

      - name: Allow UI automation without an interactive prompt
        run: sudo automationmodetool enable-automationmode-without-authentication

      # The artifact service drops a request now and then (ETIMEDOUT, ENOTFOUND). One more attempt
      # costs seconds; without it the shard is red with every test unrun.
      - name: Download UI test products
        id: products
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-test-products
          path: .artifacts/download

      - name: Download UI test products (second attempt)
        if: steps.products.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-test-products
          path: .artifacts/download

      - name: Restore UI test products
        run: |
          set -euo pipefail
          tar -C .artifacts -xzf .artifacts/download/MimicUITests.xctestproducts.tar.gz
          test -d .artifacts/MimicUITests.xctestproducts

      # A step timeout under the job's, so a hang outside any test (xcodebuild itself) still fails
      # this step and leaves time for the diagnostics below.
      - name: Test (UI)
        timeout-minutes: ${{ matrix.id == 99 && 110 || 25 }}
        env:
          ONLY_TESTING: ${{ matrix.only }}
          EXTRA: ${{ matrix.extra }}
          # Seconds one test may run before XCTest fails it with a spindump: a hung app costs one
          # test, not the shard. The shard's allowance is also the ceiling for any set in code.
          ALLOWANCE: ${{ matrix.allowance }}
          RESULT_BUNDLE: .artifacts/ui/UITests-${{ matrix.id }}.xcresult
          BUILD_LOG: .artifacts/ui-tests-${{ matrix.id }}.log
          # LayoutAuditUITests writes its frames here (the runner reads it without the prefix).
          TEST_RUNNER_MIMIC_LAYOUT_AUDIT_DIR: ${{ github.workspace }}/.artifacts/layout-audit
        run: |
          set -o pipefail
          rm -rf "$RESULT_BUNDLE"
          mkdir -p .artifacts/ui
          # $ONLY_TESTING and $EXTRA are unquoted on purpose: each is several flags.
          # shellcheck disable=SC2086
          xcodebuild test-without-building \
            -testProductsPath .artifacts/MimicUITests.xctestproducts \
            -destination 'platform=macOS,arch=arm64' \
            $ONLY_TESTING $EXTRA \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance "$ALLOWANCE" \
            -maximum-test-execution-time-allowance "$ALLOWANCE" \
            -derivedDataPath "$DERIVED_DATA" \
            -enableCodeCoverage "$COVERAGE" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGN_IDENTITY=- 2>&1 | tee "$BUILD_LOG"

      # Each leg writes its flakes to a file the UI suite verdict collects, so the run's one summary
      # lists every test that only passed on its retry.
      - name: Flaky tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          NAME: ${{ matrix.name }}
          RESULT_BUNDLE: .artifacts/ui/UITests-${{ matrix.id }}.xcresult
          LIST: .artifacts/flaky/ui-${{ matrix.id }}.md
        run: python3 Scripts/report_flaky_tests.py --label "$NAME" --list "$LIST" "$RESULT_BUNDLE"

      - name: Upload the flaky test list
        if: ${{ !cancelled() && hashFiles('.artifacts/flaky/*.md') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flaky-ui-${{ matrix.id }}
          path: .artifacts/flaky
          retention-days: 7
          if-no-files-found: ignore

      # `cancelled()` too: a job that runs into its timeout is cancelled, not failed, and that is
      # exactly the run whose evidence matters most.
      - name: Test failure details
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        env:
          RESULT_BUNDLE: .artifacts/ui/UITests-${{ matrix.id }}.xcresult
          BUILD_LOG: .artifacts/ui-tests-${{ matrix.id }}.log
        run: |
          ./Scripts/print_test_failures.sh \
            "$BUILD_LOG" \
            "$RESULT_BUNDLE" \
            "$DERIVED_DATA"/Logs/Test/*.xcresult

      - name: Upload test results
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult-ui-${{ matrix.id }}
          path: |
            .artifacts/ui/UITests-${{ matrix.id }}.xcresult
            .artifacts/ui-tests-${{ matrix.id }}.log
          retention-days: 7
          if-no-files-found: ignore

      # The layout audit's frames, as a contact sheet: thumbnails, index.html and the summary. The
      # audit runs over several shards; publish-layout-audit merges their sheets into one.
      - name: Layout audit contact sheet
        id: audit
        if: ${{ !cancelled() && hashFiles('.artifacts/layout-audit/*/frames.jsonl') != '' }}
        run: |
          set -euo pipefail
          root=.artifacts/layout-audit
          find "$root" -path "$root/thumbs" -prune -o -name '*.png' -print | while read -r png; do
            relative="${png#"$root"/}"
            mkdir -p "$root/thumbs/$(dirname "$relative")"
            sips -s format jpeg -s formatOptions 70 -Z 1200 "$png" \
              --out "$root/thumbs/${relative%.png}.jpg" >/dev/null
          done
          python3 Scripts/layout_audit_report.py "$root"
          cat "$root/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload the layout audit
        if: ${{ !cancelled() && steps.audit.outputs.ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layout-audit-${{ matrix.id }}
          path: |
            .artifacts/layout-audit/index.html
            .artifacts/layout-audit/summary.md
            .artifacts/layout-audit/thumbs
            .artifacts/layout-audit/*/frames.jsonl
          retention-days: 7
          if-no-files-found: ignore

      - name: Package the coverage bundle
        if: ${{ !cancelled() && needs.plan.outputs.coverage == 'true' }}
        env:
          BUNDLE_NAME: UITests-${{ matrix.id }}.xcresult
        run: |
          set -euo pipefail
          if [ ! -d ".artifacts/ui/$BUNDLE_NAME" ]; then
            echo "::warning::No result bundle at .artifacts/ui/$BUNDLE_NAME — this shard died before xcodebuild wrote one, so the coverage job will reject the incomplete bundle set."
            exit 0
          fi
          tar -C .artifacts/ui -czf ".artifacts/$BUNDLE_NAME.tar.gz" "$BUNDLE_NAME"
          ls -lh ".artifacts/$BUNDLE_NAME.tar.gz"

      # As in the unit job: the coverage job rejects an incomplete set, so an upload that fails
      # costs that night's badges, never a shard whose tests passed.
      - name: Upload the coverage bundle
        if: ${{ !cancelled() && needs.plan.outputs.coverage == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-bundle-ui-${{ matrix.id }}
          path: .artifacts/UITests-${{ matrix.id }}.xcresult.tar.gz
          retention-days: 1
          if-no-files-found: warn

  # Like publish-snapshots: the contact sheet goes to `layout-audit/<branch>`, one `git fetch` away
  # for a session that cannot download artifacts. Not a required check.
  publish-layout-audit:
    name: Publish the layout audit
    needs: [plan, macos-ui]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.ui == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One artifact per audit shard. Each sweep writes its own folder, so they merge without
      # clashing, except for the index and summary each shard made of its own sweeps; those are
      # written again below over the whole set.
      - name: Download the layout audit
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: layout-audit-*
          merge-multiple: true
          path: ${{ runner.temp }}/layout-audit

      - name: Push it to a branch
        if: steps.download.outcome == 'success'
        env:
          SOURCE: ${{ runner.temp }}/layout-audit
          BRANCH: layout-audit/${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if ! ls "$SOURCE"/*/frames.jsonl >/dev/null 2>&1; then
            echo "No audit shard ran in this run; nothing to publish."
            exit 0
          fi
          python3 Scripts/layout_audit_report.py "$SOURCE"
          cat "$SOURCE/summary.md" >> "$GITHUB_STEP_SUMMARY"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout --quiet --orphan "$BRANCH"
          git rm -r --quiet --cached .
          git clean -fdxq
          cp -R "$SOURCE"/. .
          git add -A
          git commit --quiet -m "chore: layout audit for $GITHUB_SHA"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          {
            echo '### Layout audit contact sheet'
            echo
            echo "Pushed to \`$BRANCH\`: open \`index.html\` after \`git fetch origin $BRANCH && git checkout FETCH_HEAD -- .\` in an empty folder."
          } >> "$GITHUB_STEP_SUMMARY"

  # A required status check: it passes when every selected shard passed, or when the plan selected
  # none. Shards the plan wanted that never ran are a failure, not a pass. A focus run's verdict
  # carries another name: one focused test passing must not read as the pull request's UI suite.
  ui-suite:
    name: ${{ inputs.only_testing && 'UI focus run' || 'UI suite' }}
    needs: [plan, macos-ui-build, macos-ui]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Collect flaky tests
        if: needs.plan.outputs.ui == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flaky-ui-*
          merge-multiple: true
          path: flaky

      - name: Verdict
        env:
          PLAN: ${{ needs.plan.result }}
          WANTED: ${{ needs.plan.outputs.ui }}
          RESULT: ${{ needs.macos-ui.result }}
        run: |
          set -euo pipefail
          # Reported whatever the verdict: a flake that passed on its retry is the warning before
          # the failure.
          if ls flaky/*.md >/dev/null 2>&1; then
            count="$(grep -h '^- ' flaky/*.md | wc -l | tr -d ' ')"
            {
              echo '### Flaky UI tests'
              echo
              echo "$count test(s) failed on one attempt and passed on another:"
              echo
              cat flaky/*.md
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Flaky UI tests::$count test(s) passed only on a retry; the UI suite summary lists them."
          fi
          if [ "$PLAN" != success ]; then
            echo "::error::The plan job did not finish ($PLAN), so nobody knows which UI tests this change needs."
            exit 1
          fi
          if [ "$WANTED" != true ]; then
            echo "The plan selected no UI shard for this change; its summary says why."
            exit 0
          fi
          echo "The selected UI shards rolled up to: $RESULT"
          case "$RESULT" in
            success)
              echo "All selected UI shards passed."
              ;;
            skipped)
              echo "::error::The plan selected UI shards but they did not run (the UI test build failed or was skipped)."
              exit 1
              ;;
            *)
              echo "::error::At least one UI shard is red. Open the run page: each shard uploads its own xcresult-ui-N artifact. Read the failing shard's 'Test failure details' step first."
              exit 1
              ;;
          esac

  coverage:
    name: Coverage (unit suites + XCUITest)
    needs: [plan, macos-checks, macos-ui]
    if: ${{ !cancelled() && needs.plan.outputs.coverage == 'true' }}
    runs-on: macos-26
    timeout-minutes: 30

    outputs:
      coverage: ${{ steps.figures.outputs.json }}

    env:
      # One bundle from the unit suites and one per shard; the plan counts the shards it ran.
      EXPECTED_COVERAGE_BUNDLES: ${{ needs.plan.outputs.expected_bundles }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the result bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-bundle-*
          merge-multiple: true
          path: .artifacts/download

      - name: Merge the result bundles
        id: merge
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p .artifacts/bundles .artifacts/merged

          for tarball in .artifacts/download/*.tar.gz; do
            [ -f "$tarball" ] || continue
            tar -C .artifacts/bundles -xzf "$tarball" || exit 1
            rm -f "$tarball"
          done

          found="$(find .artifacts/bundles -maxdepth 1 -name '*.xcresult' | sort)"
          count="$(printf '%s\n' "$found" | grep -c . || true)"
          echo "Found $count result bundle(s), expected $EXPECTED_COVERAGE_BUNDLES:"
          printf '%s\n' "$found"

          if [ "$count" -ne "$EXPECTED_COVERAGE_BUNDLES" ]; then
            {
              echo '### Coverage not published on this commit'
              echo
              echo "The merge needs $EXPECTED_COVERAGE_BUNDLES result bundles — one from the unit"
              echo "suites and one from each UI shard — and $count arrived. A union missing a"
              echo 'shard would publish a lower number with nothing to say a shard is missing, so'
              echo 'nothing is published and the badges go on showing the last figures that were.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Only $count of $EXPECTED_COVERAGE_BUNDLES coverage bundles arrived — nothing published."
            echo "state=short" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! xcrun xcresulttool merge $found --output-path .artifacts/merged/Coverage.xcresult; then
            {
              echo '### Coverage not published on this commit'
              echo
              echo '`xcrun xcresulttool merge` failed. It is the one command in this job whose'
              echo 'behaviour could not be checked before it landed, so this is a warning and not a'
              echo 'red X — the badges go on showing the last figures that were published. Read the'
              echo '`Merge the result bundles` step for what it said.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::xcresulttool merge failed — nothing published."
            echo "state=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          find .artifacts/bundles -maxdepth 1 -name 'UITests-*.xcresult' -exec rm -rf {} +
          echo "state=ready" >> "$GITHUB_OUTPUT"

      - name: Coverage report (unit suites only, for comparison)
        if: steps.merge.outputs.state == 'ready'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 Scripts/update_readme_coverage.py \
            --result-bundle .artifacts/bundles/UnitTests.xcresult \
            --title 'Code coverage — unit suites alone (the previous basis for the badges)' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Coverage report (merged)
        if: steps.merge.outputs.state == 'ready'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 Scripts/update_readme_coverage.py \
            --result-bundle .artifacts/merged/Coverage.xcresult \
            --title 'Code coverage — unit suites and XCUITest, merged (what the badges publish)' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Emit coverage figures
        id: figures
        if: steps.merge.outputs.state == 'ready'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 Scripts/update_readme_coverage.py \
            --result-bundle .artifacts/merged/Coverage.xcresult \
            --emit-json .artifacts/coverage.json
          cat .artifacts/coverage.json
          {
            echo 'json<<COVERAGE_JSON_EOF'
            cat .artifacts/coverage.json
            echo 'COVERAGE_JSON_EOF'
          } >> "$GITHUB_OUTPUT"

  record-coverage:
    name: Publish coverage badges
    needs: [plan, coverage]
    if: ${{ always() && needs.plan.outputs.coverage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the figures out
        id: figures
        env:
          COVERAGE_JSON: ${{ needs.coverage.outputs.coverage }}
        run: |
          set -euo pipefail
          if [ -z "${COVERAGE_JSON:-}" ]; then
            echo "No coverage figures in this run: the coverage job did not reach the measurement."
            echo "state=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .artifacts/coverage
          printf '%s\n' "$COVERAGE_JSON" > .artifacts/coverage/coverage.json
          echo "state=ready" >> "$GITHUB_OUTPUT"

      - name: Publish the badge payloads
        if: steps.figures.outputs.state == 'ready'
        continue-on-error: true
        run: |
          set -euo pipefail

          branch="$(python3 Scripts/update_readme_coverage.py --print-badge-branch)"

          badges="$(mktemp -d)"
          python3 Scripts/update_readme_coverage.py \
            --from-json .artifacts/coverage/coverage.json \
            --emit-badges "$badges"

          {
            echo '### Coverage badge payloads'
            echo
            echo "Measured on this commit and force-pushed to the \`$branch\` branch, where"
            echo 'shields.io reads them for the two badges at the top of README.md. If the push'
            echo 'below failed, the badges still show the last figures that were published and'
            echo 'these are the ones they would have shown.'
            for payload in "$badges"/*.json; do
              echo
              echo "\`$(basename "$payload")\`:"
              echo
              echo '```json'
              cat "$payload"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout --quiet --orphan "$branch"
          git rm -r --quiet --cached .
          cp "$badges"/*.json .
          git add app-coverage.json module-coverage.json
          git commit --quiet -m 'chore: publish measured coverage as badge endpoints'

          git push --force origin "HEAD:refs/heads/$branch"
          echo "Published to $branch."
