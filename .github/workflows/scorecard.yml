name: Scorecard

# OpenSSF Scorecard: an independent audit of the repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection, signed releases, code review, and more). It is
# the score companies look up before adopting a tool, and the badge in the README links to it.
#
# Results go to the Security tab as code scanning alerts, so a regression shows up next to CodeQL's,
# and are published to the OpenSSF API that the badge reads. Publishing requires the workflow to
# run only on the default branch, with no other jobs and no secrets.

on:
  push:
    branches: [main]
  # Re-scores when branch protection changes, which Scorecard weighs heavily.
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read          # check out the repository; job permissions replace read-all
      security-events: write  # upload the results as code scanning alerts
      id-token: write         # sign the published results with this workflow's identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
