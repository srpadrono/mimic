name: Release

# Builds the signed, notarized installer on a GitHub-hosted runner instead of a developer's Mac, so
# every release carries proof of where it came from:
#
#   - a build provenance attestation (anyone can run `gh attestation verify Mimic-X.Y.Z.pkg
#     --repo srpadrono/mimic`) tying the exact .pkg to this workflow, this tag and this commit;
#   - an SPDX SBOM of the Swift packages the app is built from, attached to the release and attested
#     against the .pkg.
#
# It stops at a **draft** release. The regression gate in docs/RELEASE_REGRESSION.md is run by hand
# against the downloaded draft, its recordings are attached, and a person publishes it. With release
# immutability on, publishing is the point after which the tag and the assets can no longer change.
#
# The signing material lives in the `release` environment, which requires a reviewer's approval
# before this job can read it. CONTRIBUTING ▸ Releases lists the six secrets.

on:
  push:
    tags: ["v*"]
  # Re-runs a release from the Actions tab: pick the tag in "Use workflow from".
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with XCODE_VERSION in ci.yml: a release should be built by the Xcode the tests ran on.
  XCODE_VERSION: "26.6"

jobs:
  package:
    name: Build, notarize and attest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write      # create the draft release and upload its assets
      id-token: write      # sign the attestations with this workflow's identity
      attestations: write  # store them on the repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag names the release, Project.swift names the build. package_release.sh already refuses
      # an app and CLI that disagree; this refuses a tag that disagrees with both.
      - name: Check the tag matches the app version
        run: |
          set -euo pipefail
          version="$(grep -m1 '"MARKETING_VERSION"' Project.swift | sed -E 's/.*: *"([^"]+)".*/\1/')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in Project.swift."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Before macos-setup, so the scan sees the checked-in lockfiles (Tuist/Package.resolved,
      # Package.resolved, Vendor/CodeEditorView) and not every dependency's own checkout.
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/Mimic-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: ./.github/actions/macos-setup

      # A throwaway keychain that exists for this job only. It becomes the default keychain and joins
      # the search list because package_release.sh finds identities with `security find-identity`
      # and notarizes with `--keychain-profile`, and both only look there.
      - name: Import the signing certificates
        env:
          DEVELOPER_ID_APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          DEVELOPER_ID_INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          for name in DEVELOPER_ID_APP_P12 DEVELOPER_ID_INSTALLER_P12; do
            file="$RUNNER_TEMP/$name.p12"
            printf '%s' "${!name}" | base64 --decode > "$file"
            security import "$file" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
            rm -f "$file"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            existing+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security default-keychain -d user -s "$keychain"

          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          xcrun notarytool store-credentials mimic-notary \
            --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --keychain "$keychain"
          rm -f "$key"

      - name: Build, sign and notarize the installer
        env:
          MIMIC_TEAM_ID: KW6369JJL9
          MIMIC_NOTARY_PROFILE: mimic-notary
        run: ./Scripts/package_release.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .artifacts/release/Mimic-${{ env.VERSION }}.pkg

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .artifacts/release/Mimic-${{ env.VERSION }}.pkg
          sbom-path: ${{ runner.temp }}/Mimic-${{ env.VERSION }}.spdx.json

      # Draft only. A person runs the regression gate and publishes; see CONTRIBUTING ▸ Releases.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg=".artifacts/release/Mimic-$VERSION.pkg"
          sbom="$RUNNER_TEMP/Mimic-$VERSION.spdx.json"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A re-run replaces the assets of the draft it made. A published, immutable release
            # refuses this, which is the point.
            gh release upload "$GITHUB_REF_NAME" "$pkg" "$sbom" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$pkg" "$sbom" \
              --draft --verify-tag --title "Mimic $GITHUB_REF_NAME" \
              --notes "Draft built by the Release workflow. Run the regression gate, then write the notes and publish."
          fi
          sha="$(shasum -a 256 "$pkg" | cut -d' ' -f1)"
          {
            echo "### Mimic $VERSION"
            echo
            echo "Draft release: $GITHUB_REF_NAME"
            echo
            echo "For srpadrono/homebrew-tap Casks/mimic.rb:"
            echo
            echo '```ruby'
            echo "version \"$VERSION\""
            echo "sha256 \"$sha\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          security default-keychain -d user -s login.keychain-db 2>/dev/null || true
